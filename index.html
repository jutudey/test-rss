<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJ's Podcast</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #12233a; color: #e8eef5;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 2rem;
  }
  .card { max-width: 30rem; text-align: center; }
  img { width: 220px; height: 220px; border-radius: 14px; margin-bottom: 1.5rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.75rem; }
  p { color: #9fb4cc; margin: 0 0 1.5rem; }
  a.feed {
    display: inline-block; padding: .7rem 1.4rem; border-radius: 8px;
    background: #7fb2e5; color: #12233a; font-weight: 600; text-decoration: none;
  }
  code {
    display: block; margin-top: 1.5rem; padding: .7rem; border-radius: 6px;
    background: #0d1929; color: #7fb2e5; font-size: .8rem; word-break: break-all;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="cover-art.png" alt="AJ's Podcast cover art">
    <h1>AJ's Podcast</h1>
    <p>Deep dives on whatever I feed it — two AI hosts, one conversation.</p>
    <a class="feed" href="feed.xml">RSS feed</a>
    <code>https://jutudey.github.io/test-rss/feed.xml</code>
  </div>
</body>
</html>
